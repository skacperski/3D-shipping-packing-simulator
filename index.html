<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Box Packing Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Panel -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>📦 Packing Simulator</h1>
                <p class="subtitle">3D Box Optimizer</p>
            </div>

            <!-- Container Settings -->
            <section class="panel-section">
                <h2 class="section-title">Container Size (cm)</h2>
                <div class="container-inputs">
                    <div class="input-group">
                        <label for="containerW">W</label>
                        <input type="number" id="containerW" value="60" min="10" max="200" step="1">
                    </div>
                    <div class="input-group">
                        <label for="containerH">H</label>
                        <input type="number" id="containerH" value="40" min="10" max="200" step="1">
                    </div>
                    <div class="input-group">
                        <label for="containerD">D</label>
                        <input type="number" id="containerD" value="40" min="10" max="200" step="1">
                    </div>
                    <button id="updateContainer" class="btn btn-secondary btn-sm">Update</button>
                </div>
            </section>

            <!-- Add Items -->
            <section class="panel-section">
                <h2 class="section-title">Add Items</h2>
                <div class="item-buttons">
                    <button class="btn btn-item" data-type="filly" style="--item-color: #FF6B6B">
                        <span class="item-icon">🧸</span>
                        <span class="item-info">
                            <strong>Filly Plush</strong>
                            <small>33 × 18 × 10.5 cm</small>
                        </span>
                    </button>
                    <button class="btn btn-item" data-type="dilly" style="--item-color: #4ECDC4">
                        <span class="item-icon">🧸</span>
                        <span class="item-info">
                            <strong>Dilly Plush</strong>
                            <small>35 × 18.5 × 12 cm</small>
                        </span>
                    </button>
                    <button class="btn btn-item" data-type="box" style="--item-color: #FFD93D">
                        <span class="item-icon">📦</span>
                        <span class="item-info">
                            <strong>Box</strong>
                            <small>33 × 9 × 25 cm</small>
                        </span>
                    </button>
                    <button class="btn btn-item" data-type="die" style="--item-color: #6C5CE7">
                        <span class="item-icon">🎲</span>
                        <span class="item-info">
                            <strong>Die</strong>
                            <small>15 × 15 × 15 cm</small>
                        </span>
                    </button>
                </div>
            </section>

            <!-- Controls -->
            <section class="panel-section">
                <h2 class="section-title">Controls</h2>
                <div class="control-buttons">
                    <button id="modeTranslate" class="btn btn-control active" title="Move (W)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
                        Move
                    </button>
                    <button id="modeRotate" class="btn btn-control" title="Rotate (E)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
                        Rotate
                    </button>
                </div>
                <div class="control-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="snapToggle" checked>
                        <span>Snap to grid (0.5 cm)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="rotSnapToggle" checked>
                        <span>Snap rotation (90°)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="collisionToggle" checked>
                        <span>Show collisions</span>
                    </label>
                </div>
                <div class="action-buttons">
                    <button id="deleteSelected" class="btn btn-danger btn-sm" disabled>Delete Selected</button>
                    <button id="clearAll" class="btn btn-danger btn-sm">Clear All</button>
                    <button id="autoPackBtn" class="btn btn-primary btn-sm">Auto Pack</button>
                </div>
            </section>

            <!-- Items List -->
            <section class="panel-section">
                <h2 class="section-title">Items in Container <span id="itemCount" class="badge">0</span></h2>
                <div id="itemsList" class="items-list">
                    <p class="empty-state">No items added yet</p>
                </div>
            </section>

            <!-- Statistics -->
            <section class="panel-section">
                <h2 class="section-title">Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value" id="statVolUsed">0</span>
                        <span class="stat-label">cm³ used</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="statVolTotal">96,000</span>
                        <span class="stat-label">cm³ total</span>
                    </div>
                    <div class="stat-card highlight">
                        <span class="stat-value" id="statPercent">0%</span>
                        <span class="stat-label">utilization</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="statCollisions">0</span>
                        <span class="stat-label">collisions</span>
                    </div>
                </div>
            </section>

            <!-- Keyboard Shortcuts -->
            <section class="panel-section shortcuts">
                <h2 class="section-title">Shortcuts</h2>
                <div class="shortcut-list">
                    <span><kbd>W</kbd> Move</span>
                    <span><kbd>E</kbd> Rotate</span>
                    <span><kbd>Del</kbd> Delete</span>
                    <span><kbd>Esc</kbd> Deselect</span>
                    <span><kbd>Scroll</kbd> Zoom</span>
                    <span><kbd>RMB</kbd> Orbit</span>
                </div>
            </section>
        </aside>

        <!-- 3D Viewport -->
        <main id="viewport">
            <div id="canvas-container"></div>
            <div id="info-overlay">
                <span id="selectedInfo">Click an item to select it</span>
            </div>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
