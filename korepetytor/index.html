<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sowa Liczba – korepetytor z ułamków i rachunków w pamięci</title>
<style>
:root{--bg:#f3f6fd;--ink:#1f2937;--mut:#6b7280;--pri:#4f46e5;--pri2:#eef2ff;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--acc:#f59e0b;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}
#app{display:grid;grid-template-columns:330px 1fr;grid-template-rows:58px 1fr;height:100vh;height:100dvh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff}
header h1{font-size:19px;margin:0;flex:1;font-weight:700}
#menu{display:none;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;font-size:20px;padding:6px 12px;cursor:pointer}
#stars{font-weight:700;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-size:16px;white-space:nowrap}
#side{overflow:auto;background:#fff;border-right:1px solid var(--line);padding:10px 10px 30px}
#side details{margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#fafbff}
#side summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:16px;list-style:none}
#side summary small{display:block;font-weight:500;color:var(--mut);font-size:13px}
#side summary::-webkit-details-marker{display:none}
.tk{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer;border-top:1px solid var(--line);color:var(--ink)}
.tk:hover{background:var(--pri2)}
.tk.act{background:var(--pri2);font-weight:700}
.tk .st{margin-left:auto;font-size:13px;white-space:nowrap;color:#d97706}
.tk .ck{width:20px;text-align:center}
#reset{margin:14px 6px 0;font-size:13px;color:var(--mut);background:none;border:0;text-decoration:underline;cursor:pointer}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
#chat{flex:1;overflow:auto;padding:16px 18px 8px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;margin:10px 0;max-width:780px;animation:pop .25s ease-out}
.msg.me{justify-content:flex-end;margin-left:auto}
.av{font-size:30px;line-height:1;flex:none;margin-top:2px}
.bub{background:#fff;border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:10px 15px;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}
.me .bub{background:var(--pri);color:#fff;border:0;border-radius:18px 6px 18px 18px}
.msg.good .bub{background:var(--okbg);border-color:#86efac}
.msg.warn .bub{background:#fff7ed;border-color:#fdba74}
.msg.info .bub{background:#eff6ff;border-color:#93c5fd}
.msg.head .bub{background:linear-gradient(90deg,#eef2ff,#faf5ff);border-color:#c7d2fe}
.msg.head h3{margin:0 0 2px;font-size:20px}
.pg{font-size:13px;color:var(--mut)}
.ex{background:var(--pri2);border-left:5px solid var(--pri);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:17px}
.tip{color:#92400e}
.expr{display:inline-block;background:var(--pri2);border-radius:8px;padding:1px 10px;font-weight:700;font-size:1.15em;margin:2px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.2;font-size:.95em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.fr span:last-child{padding:0 4px}
pre.col{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 14px;font-size:18px;line-height:1.35;display:inline-block;margin:6px 0;overflow:auto;max-width:100%}
table.tb{border-collapse:collapse;margin:6px 0;font-size:16px}
table.tb td,table.tb th{border:1px solid #cbd5e1;padding:3px 10px}
table.tb th{background:#f1f5f9}
#dock{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);min-height:78px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-size:17px;font-weight:700;border:2px solid var(--pri);color:var(--pri);background:#fff;border-radius:12px;padding:9px 18px;cursor:pointer}
.btn.primary{background:var(--pri);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--mut);font-weight:600}
.btn:hover{filter:brightness(.95)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
input.inp,.fld input,.wrow input{font:inherit;font-size:20px;font-weight:600;border:2px solid #c7d2fe;border-radius:12px;padding:8px 12px;width:200px;max-width:100%}
input.bad{border-color:var(--bad);background:var(--badbg)}
input.good{border-color:#16a34a;background:var(--okbg)}
.grid{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.fld{display:flex;flex-direction:column;font-size:14px;color:var(--mut);font-weight:600}
.fld input{width:130px;margin-top:2px}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opt{font:inherit;font-size:17px;text-align:left;border:2px solid #c7d2fe;background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer}
.opt:hover{background:var(--pri2)}
.opt.sel{background:var(--pri2);border-color:var(--pri);font-weight:700}
.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;opacity:.8}
.opt.good{background:var(--okbg);border-color:#16a34a}
.opt:disabled{cursor:default}
.widget{background:#fff;border:2px dashed #a5b4fc;border-radius:16px;padding:12px 16px;margin:6px 0;max-width:560px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wrow .btn{padding:6px 12px;font-size:16px}
.wres{font-size:22px;font-weight:700;background:var(--pri2);border-radius:10px;padding:8px 12px}
.wres small{display:block;font-size:14px;font-weight:500;color:var(--mut)}
.big{font-size:44px;text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media(max-width:820px){
 body{font-size:17px}
 #app{grid-template-columns:1fr}
 #menu{display:block}
 #side{position:fixed;top:58px;bottom:0;left:0;width:88%;max-width:360px;z-index:10;transform:translateX(-102%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
 #side.open{transform:none}
 header h1{font-size:16px}
 #chat{padding:10px}
 .av{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
 <header><button id="menu" aria-label="Lista zadań">☰</button><h1>🦉 Sowa Liczba – Twój korepetytor</h1><div id="stars">⭐ 0</div></header>
 <aside id="side"></aside>
 <main><div id="chat" aria-live="polite"></div><div id="dock"></div></main>
</div>
<script>
'use strict';
/* ====== narzędzia ====== */
const R=x=>Math.round(x*1e12)/1e12;
const ev=e=>R(Function('"use strict";return ('+e+')')());
function fmt(n){
  n=R(n);let s=String(n);
  if(/e/.test(s))s=n.toFixed(12).replace(/0+$/,'').replace(/\.$/,'');
  let [i,d]=s.split('.');const neg=i[0]==='-';if(neg)i=i.slice(1);
  if(i.length>=5)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'−':'')+i+(d?','+d:'');
}
function parse(t){
  t=String(t).trim().replace(/[\s ]/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/[a-zA-Zżółćęśąźń²³%]+$/g,'');
  if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(t)){const [a,b]=t.split('/');return R(a/b)}
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t))return NaN;
  return R(parseFloat(t));
}
const close=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b));
function disp(e){
  return e.replace(/(\d+(?:\.\d+)?)\*\*2/g,'$1²').replace(/(\d+(?:\.\d+)?)\*\*3/g,'$1³')
    .replace(/\)\*\*2/g,')²').replace(/\)\*\*3/g,')³')
    .replace(/\*/g,' · ').replace(/\//g,' : ').replace(/-/g,' − ').replace(/\+/g,' + ')
    .replace(/(\d)\.(\d)/g,'$1,$2').replace(/\s{2,}/g,' ');
}
const FR=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const norm=s=>String(s).toLowerCase().replace(/[ąćęłńóśźż]/g,c=>({ą:'a',ć:'c',ę:'e',ł:'l',ń:'n',ó:'o',ś:'s',ź:'z',ż:'z'}[c])).replace(/[^a-z0-9]/g,'');
/* przesunięcie przecinka: napis z kropką -> napis z przecinkiem */
function shiftComma(str,k){
  str=String(str).replace(',','.');
  let [i,d='']=str.split('.');
  let digits=i+d,pos=i.length+k;
  if(pos<=0){digits='0'.repeat(1-pos)+digits;pos=1}
  while(pos>digits.length)digits+='0';
  let ip=digits.slice(0,pos).replace(/^0+(?=\d)/,''),fp=digits.slice(pos).replace(/0+$/,'');
  return fp?ip+','+fp:ip;
}
/* ====== treść lekcji ====== */
const CH=[];
const ch=(title,pages,icon,tasks)=>CH.push({title,pages,icon,tasks});
const T=h=>({t:'say',h});
const N=(q,a,o={})=>({t:'num',q,a:typeof a==='string'?ev(a):a,...o});
const M=(q,fields,o={})=>({t:'multi',q,fields:fields.map(f=>({l:f[0],a:typeof f[1]==='string'?ev(f[1]):f[1],u:f[2]||''})),...o});
const C=(q,opts,a,o={})=>({t:'choice',q,opts,a,...o});
const X=(q,acc,o={})=>({t:'text',q,acc,...o});
const NB=(q,o={})=>({t:'note',q,...o});
const W=(name)=>({t:'widget',name});
const F=(...a)=>a.flat(Infinity);
/* zestaw przykładów: ['a) 4+5', ['b) 6-2',{sol:'...'}], ...] */
function I(list,o={}){
  const core=o.core||list.length,out=[];
  list.forEach((it,k)=>{
    let e=it,op={};
    if(Array.isArray(it)){e=it[0];op=it[1]||{}}
    let lab='';const m=/^([a-z])\)\s*(.*)$/.exec(e);
    if(m){lab=m[1]+') ';e=m[2]}
    const show=op.show||disp(e);
    const s=Object.assign({t:'num',a:ev(e),hint:o.hint,sol:o.sol,unit:o.unit},op);
    s.q=(o.pre===undefined?'Oblicz: ':o.pre)+lab+'<span class="expr">'+show+' = ?</span>';
    delete s.show;
    out.push(s);
    if(k===core-1&&list.length>core)out.push({t:'gate',skip:list.length-core});
  });
  return out;
}

/* ================= ROZDZIAŁ 1 ================= */
ch('Liczby naturalne w pamięci','s. 10–11','🧮',[
{title:'Ćwiczenie A – dodawanie i odejmowanie',steps:F(
 T(`Zaczynamy od liczenia w głowie – bez kartki! 🧠<br>Sekret nie polega na super-mózgu, tylko na tym, żeby <b>rozbijać liczby na wygodne kawałki</b>.`),
 T(`<b>Dodawanie – dobijamy do okrągłej liczby.</b>
  <div class="ex">78 + 12<br>① 78 + <b>2</b> = 80 &nbsp;(dobiliśmy do pełnej dziesiątki)<br>② 80 + <b>10</b> = <b>90</b></div>
  <div class="ex">253 + 407<br>Setki: 200 + 400 = 600<br>Reszta: 53 + 7 = 60<br>Razem: 600 + 60 = <b>660</b></div>`),
 T(`<b>Odejmowanie – odejmuj po kawałku.</b>
  <div class="ex">106 − 42<br>① 106 − 40 = 66<br>② 66 − 2 = <b>64</b></div>
  <div class="ex">548 − 490 = 548 − 500 + 10 = <b>58</b><br>Odjęliśmy o 10 za dużo, więc 10 oddajemy z powrotem.</div>`),
 I([
  ['a) 78+12',{sol:'78 + 2 = 80, potem 80 + 10 = 90.'}],
  ['b) 253+407',{sol:'200 + 400 = 600, 53 + 7 = 60, razem 660.'}],
  ['c) 630+3019',{sol:'3019 + 600 = 3619, potem + 30 = 3649.'}],
  ['d) 7200+850',{sol:'7200 + 800 = 8000, potem + 50 = 8050.'}],
  ['e) 106-42',{sol:'106 − 40 = 66, potem 66 − 2 = 64.'}],
  ['f) 548-490',{sol:'548 − 500 = 48, a ponieważ odjęliśmy o 10 za dużo, dodajemy 10: 58.'}],
  ['g) 2020-815',{sol:'2020 − 800 = 1220, potem 1220 − 15 = 1205.'}],
  ['h) 3500-240',{sol:'3500 − 200 = 3300, potem 3300 − 40 = 3260.'}]
 ],{core:5,hint:'Rozbij drugą liczbę na wygodne kawałki (np. 12 = 2 + 10) albo dobij do okrągłej liczby.'}),
 C(`Sprawdzam, czy rozumiesz! Które sposoby są <b>poprawne</b> dla 2020 − 815? (zaznacz wszystkie dobre)`,[
  '2020 − 800 = 1220, potem 1220 − 15 = 1205',
  '2020 − 800 = 1220, potem 1220 + 15 = 1235',
  '2020 − 1000 = 1020, potem 1020 + 185 = 1205 (bo 815 = 1000 − 185)',
  '2020 − 15 = 2005, potem 2005 − 800 = 1205'
 ],[0,2,3],{hint:'Gdy odejmujesz po kawałku, kolejność nie ma znaczenia. Gdy odejmiesz za dużo – trzeba oddać różnicę.',ok:'Właśnie! Jest wiele dróg do tego samego wyniku. Wybieraj tę, która jest dla Ciebie najłatwiejsza. 😉'}),
 NB(`W książce jest polecenie: <i>„Opowiedz, jak wykonujesz rachunki”</i>. Powiedz na głos (komuś albo sobie), jak liczysz <b>7200 + 850</b>. Dasz radę w dwóch zdaniach?`)
)},
{title:'Ćwiczenie B – mnożenie i dzielenie',steps:F(
 T(`<b>Mnożenie – rozbij jedną liczbę.</b>
  <div class="ex">48 · 2 = 40 · 2 + 8 · 2 = 80 + 16 = <b>96</b></div>
  <div class="ex">204 · 4 = 200 · 4 + 4 · 4 = 800 + 16 = <b>816</b></div>
  Z zerami: 6 · 110 = 6 · 100 + 6 · 10 = 600 + 60 = <b>660</b>.`),
 T(`<b>Dzielenie – też możesz rozbijać.</b>
  <div class="ex">108 : 4 = (100 + 8) : 4 = 25 + 2 = <b>27</b></div>
  <div class="ex">350 : 7 → 35 : 7 = 5, a 350 to „dziesięć razy więcej”, więc <b>50</b></div>
  Dzielenie zawsze możesz <b>sprawdzić mnożeniem</b>: 75 : 15 = 5, bo 15 · 5 = 75.`),
 I([
  ['a) 48*2',{sol:'40 · 2 + 8 · 2 = 80 + 16 = 96.'}],
  ['b) 204*4',{sol:'200 · 4 + 4 · 4 = 800 + 16 = 816.'}],
  ['c) 6*110',{sol:'6 · 100 + 6 · 10 = 600 + 60 = 660.'}],
  ['d) 350*3',{sol:'300 · 3 + 50 · 3 = 900 + 150 = 1050.'}],
  ['e) 60/5',{sol:'12 · 5 = 60, więc wynik to 12.'}],
  ['f) 75/15',{sol:'15 · 5 = 75, więc wynik to 5.'}],
  ['g) 350/7',{sol:'35 : 7 = 5, więc 350 : 7 = 50.'}],
  ['h) 108/4',{sol:'100 : 4 = 25, 8 : 4 = 2, razem 27.'}]
 ],{core:6,hint:'Rozbij jedną z liczb na „setki + dziesiątki + jedności” i policz osobno.'}),
 C(`Jak najlepiej sprawdzić, czy <b>108 : 4 = 27</b> jest poprawne?`,[
  'Pomnożyć: 27 · 4 – powinno wyjść 108',
  'Dodać: 27 + 4',
  'Odjąć: 108 − 27',
  'Nie da się tego sprawdzić'
 ],0,{hint:'Dzielenie i mnożenie to „odwrotne” działania.',ok:'Tak! 27 · 4 = 108 ✓. To Twój wbudowany sprawdzacz błędów.'})
)},
{title:'Ćwiczenie C – liczby z zerami na końcu',steps:F(
 T(`Przy liczbach z zerami na końcu jest świetny trik.<br><b>Mnożenie:</b> pomnóż liczby bez zer, a potem <b>dopisz wszystkie zera</b>.
  <div class="ex">130 · 200<br>13 · 2 = 26, zer było 1 + 2 = 3<br>Wynik: 26 <b>000</b></div>
  <div class="ex">250 · 40 → 25 · 4 = <b>100</b>, zer było 2 → 100<b>00</b> = 10 000</div>
  Uwaga! Jeśli wynik mnożenia <i>sam</i> ma zero na końcu (jak 100), te zera też zostają.`),
 T(`<b>Dzielenie:</b> skreśl po tyle samo zer w obu liczbach.
  <div class="ex">42 000 : 700 → skreślamy po 2 zera → 420 : 7 = <b>60</b></div>
  Wynik się nie zmienia, bo dzielimy obie liczby przez to samo (przez 100).`),
 N(`Ile zer dopiszesz do wyniku 13 · 2 w zadaniu <b>130 · 200</b>?`,3,{hint:'Policz zera w obu liczbach: w 130 jest 1, a w 200 są 2.'}),
 N(`A ile to <b>250 · 40</b>?`,10000,{hint:'25 · 4 = 100, a potem dopisz 2 zera.',sol:'25 · 4 = 100 i dopisujemy dwa zera: 10 000.'}),
 I([
  ['a) 370*200',{sol:'37 · 2 = 74, dopisz 3 zera (1 + 2): 74 000.'}],
  ['b) 500*8000',{sol:'5 · 8 = 40, dopisz 5 zer (2 + 3): 40 00000 = 4 000 000.'}],
  ['c) 1640000/4000',{show:'1 640 000 : 4000',sol:'Skreśl po 3 zera: 1640 : 4 = 410.'}],
  ['d) 32000/160',{show:'32 000 : 160',sol:'Skreśl po 1 zerze: 3200 : 16 = 200.'}]
 ],{hint:'Mnożenie: dopisz wszystkie zera. Dzielenie: skreśl po tyle samo zer.'}),
 C(`Dlaczego przy dzieleniu <b>wolno</b> skreślić po tyle samo zer w obu liczbach?`,[
  'Bo wynik dzielenia się nie zmienia, gdy obie liczby podzielimy przez to samo',
  'Bo zera nic nie znaczą',
  'Bo wtedy wynik robi się dwa razy mniejszy'
 ],0,{ok:'Dokładnie. Skreślenie zer = dzielenie obu liczb przez 10, 100, 1000… A to nie zmienia wyniku.'})
)},
{title:'Zadanie 1 – dodawanie i odejmowanie',steps:F(
 T(`Zadanie 1 ze strony 11. Dwanaście przykładów – pokaż, co potrafisz! Pamiętaj: dobijaj do okrągłych liczb i rozbijaj na kawałki.`),
 I(['a) 62+78','b) 182+43','c) 437+302','d) 1640+2020','e) 154+1024','f) 459+57','g) 97-29','h) 205-64','i) 687-232','j) 1235-995','k) 1050-850','l) 6500-440'],
  {core:6,hint:'Np. 459 + 57: 459 + 1 = 460, potem 460 + 56. Albo odejmuj/dodawaj po kawałku: 97 − 29 = 97 − 30 + 1.'})
)},
{title:'Zadanie 2 – mnożenie i dzielenie',steps:F(
 T(`Zadanie 2. Teraz mnożenie i dzielenie w pamięci. Przypomnij sobie triki: rozbijanie, sprawdzanie mnożeniem, 7 · 19 = 7 · 20 − 7.`),
 I(['a) 97*2','b) 56*2','c) 109*3','d) 250*5','e) 211*100','f) 7*19','g) 72/4','h) 148/4','i) 120/5','j) 2800/7','k) 750/3','l) 279/9'],
  {core:6,hint:'Rozbijaj: 97 · 2 = 100 · 2 − 3 · 2. Dzielenie sprawdź mnożeniem.'})
)},
{title:'Zadanie 3 – iloczyny i ilorazy z zerami',steps:F(
 T(`Zadanie 3 – wykorzystaj trik z zerami z ćwiczenia C:<br>mnożenie → <b>dopisz wszystkie zera</b>, dzielenie → <b>skreśl po tyle samo</b>.`),
 I(['a) 400*700','b) 2300*30','c) 2200*60','d) 120*500','e) 4900/70','f) 400/80','g) 45000/150','h) 880000/40'],
  {core:5,hint:'Mnóż liczby bez zer, potem dopisz zera. Np. 2300 · 30 → 23 · 3 = 69 i 3 zera = 69 000.'})
)},
{title:'Zadanie 4 – odczytywanie liczb z osi',steps:F(
 T(`Zadanie 4: odczytujemy liczby z <b>osi liczbowej</b>. Metoda w 3 krokach:
  <div class="ex">① Znajdź dwie kreski, które mają napisane liczby.<br>② Policz, ile <b>odcinków</b> jest między nimi.<br>③ Różnicę liczb podziel na tyle odcinków – tyle wynosi <b>jeden odcinek</b>.</div>`),
 N(`Ćwiczymy na przykładzie. Kreski podpisano: 20 i 30, a między nimi jest <b>5 równych odcinków</b>. Ile wynosi jeden odcinek?`,2,{hint:'30 − 20 = 10, a 10 podziel na 5 odcinków.'}),
 N(`Sąsiednie kreski są podpisane <b>103</b> i <b>105</b>. Punkt D leży dokładnie <b>pośrodku</b> między nimi. Jaka to liczba?`,104,{hint:'Pośrodku między 103 a 105 to liczba, która jest o tyle samo od obu.'}),
 C(`Jedna kreska na osi to 10, a następna to 15. Punkt leży dokładnie pośrodku. To liczba…`,['12,5','12','13','7,5'],0,{hint:'Dodaj obie liczby i podziel przez 2, albo znajdź połowę z 5.',ok:'Tak, (10 + 15) : 2 = 12,5.'}),

/* ====== silnik korepetytora ====== */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PRAISE=['Brawo! 🎉','Dokładnie! ✅','Tak jest! 💪','Świetnie! ⭐','Super! 👏','Pięknie! 🌟','Zgadza się! 🙌'];
const KEY='sowa-liczba-v1';
let store={name:'',prog:{}};
try{const s=localStorage.getItem(KEY);if(s)store=Object.assign(store,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const chat=$('#chat'),dock=$('#dock'),side=$('#side');
let cur=null;

/* --- wiadomości --- */
const subst=h=>String(h).replace(/\{name\}/g,store.name||'');
function scrollDown(){requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight})}
function say(h,cls=''){
  const m=el('div','msg '+cls);
  m.innerHTML='<div class="av">🦉</div><div class="bub">'+subst(h)+'</div>';
  chat.appendChild(m);scrollDown();return m;
}
function me(h){const m=el('div','msg me');m.innerHTML='<div class="bub">'+h+'</div>';chat.appendChild(m);scrollDown()}
function setDock(...nodes){
  dock.innerHTML='';nodes.filter(Boolean).forEach(n=>dock.appendChild(n));
  const f=dock.querySelector('input,button.primary,button');
  if(f&&!/Mobi|Android/i.test(navigator.userAgent))f.focus();
}
const btn=(t,c,f)=>{const b=el('button','btn '+(c||''),t);b.type='button';if(f)b.onclick=f;return b};
const flash=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};

/* --- pasek boczny --- */
const taskKey=(ci,ti)=>ci+'-'+ti;
function totalStars(){return Object.values(store.prog).reduce((a,p)=>a+p.stars,0)}
function buildSide(){
  side.innerHTML='';
  CH.forEach((c,ci)=>{
    const d=el('details');
    if(cur?cur.ci===ci:ci===0)d.open=true;
    const done=c.tasks.filter((_,ti)=>store.prog[taskKey(ci,ti)]).length;
    d.appendChild(el('summary','',`${c.icon} ${ci+1}. ${c.title}<small>${c.pages} · ${done}/${c.tasks.length} zadań</small>`));
    c.tasks.forEach((t,ti)=>{
      const p=store.prog[taskKey(ci,ti)];
      const b=el('button','tk'+(cur&&cur.ci===ci&&cur.ti===ti?' act':''));
      b.innerHTML=`<span class="ck">${p?'✅':'○'}</span><span>${t.title}</span><span class="st">${p?'⭐'.repeat(p.stars):''}</span>`;
      b.onclick=()=>{side.classList.remove('open');startTask(ci,ti)};
      d.appendChild(b);
    });
    side.appendChild(d);
  });
  const r=el('button','','Zacznij od nowa (skasuj postępy)');r.id='reset';
  r.onclick=()=>{if(confirm('Na pewno skasować wszystkie gwiazdki i postępy?')){store.prog={};save();buildSide();updateStars();intro()}};
  side.appendChild(r);
  updateStars();
}
const updateStars=()=>{$('#stars').textContent='⭐ '+totalStars()+' / '+(CH.reduce((a,c)=>a+c.tasks.length,0)*3)};
$('#menu').onclick=()=>side.classList.toggle('open');

/* --- nawigacja --- */
function nextUndone(from){
  const list=[];CH.forEach((c,ci)=>c.tasks.forEach((_,ti)=>list.push([ci,ti])));
  const start=from?list.findIndex(x=>x[0]===from[0]&&x[1]===from[1])+1:0;
  for(let k=0;k<list.length;k++){const x=list[(start+k)%list.length];if(!store.prog[taskKey(x[0],x[1])])return x}
  return null;
}
function startTask(ci,ti){
  const task=CH[ci].tasks[ti];
  cur={ci,ti,task,i:0,pts:0,max:0,weak:0,S:{}};
  chat.innerHTML='';setDock();buildSide();
  say(`<h3>${CH[ci].icon} ${task.title}</h3><span class="pg">Rozdział ${ci+1}: ${CH[ci].title} (${CH[ci].pages})</span>`,'head');
  next();
}
function next(){
  if(!cur)return;
  const s=cur.task.steps[cur.i++];
  if(!s)return finish();
  STEP[s.t](s);
}
const contBtn=(label='Dalej ▶')=>setDock(btn(label,'primary',()=>{setDock();next()}));

/* --- punktacja i zakończenie pytania --- */
function finishQ(s,st,ok,note,reveal){
  const c=cur;
  if(!s.free){c.max++;c.pts+=ok?((st.tries||st.hinted)?0.5:1):0;if(!ok)c.weak++}
  setDock();
  if(ok){say(`<b>${pick(PRAISE)}</b> ${note||''}`,'good');if(s.ok)say(s.ok)}
  else say(reveal,'info');
  if(s.ok||!ok)contBtn();else setTimeout(()=>{if(cur===c)next()},650);
}
function wrongMsg(s,st,extra){
  st.hinted=true;
  say('Hmm, jeszcze nie to. 🤔 '+(extra||'')+(s.hint?`<br><span class="tip">💡 ${s.hint}</span>`:'')+'<br>Spróbuj jeszcze raz!','warn');
}
const hintBtn=(s,st)=>btn('💡 Podpowiedź','ghost',()=>{st.hinted=true;say(`<span class="tip">💡 ${s.hint||'Rozbij zadanie na mniejsze kroki i policz po kawałku.'}</span>`,'warn')});
const answerText=(s,A)=>fmt(A)+(s.unit?' '+s.unit:'');

/* --- kroki --- */
const STEP={};
STEP.say=s=>{say(s.h);if(s.widget)return;setDock(btn(s.btn||'Dalej ▶','primary',()=>{setDock();next()}))};

STEP.num=s=>{
  say(s.q);
  const st={tries:0,hinted:false};
  const inp=el('input','inp');inp.type='text';inp.inputMode='decimal';inp.placeholder='Wpisz odpowiedź…';inp.autocomplete='off';inp.setAttribute('aria-label','Twoja odpowiedź');
  const go=()=>{
    const v=parse(inp.value);
    if(isNaN(v)){flash(inp);return}
    const A=typeof s.a==='function'?s.a(cur.S):s.a;
    let good=false,note='',msg='';
    if(s.check){
      const r=s.check(v,cur.S);
      if(r&&r.retry){say(r.retry,'warn');flash(inp);return}
      if(r===true){good=true;note=s.okAny||''}else if(typeof r==='string')msg=r;
    }else{
      good=close(v,A);
      if(!good&&s.accept)for(const c of s.accept)if(close(v,c.a)){good=true;note=c.note||''}
      if(!good&&s.alts)for(const c of s.alts)if(close(v,c.a))msg=c.msg;
    }
    me(fmt(v)+(s.unit?' '+s.unit:''));
    if(good)return finishQ(s,st,true,note);
    st.tries++;
    if(st.tries<2){wrongMsg(s,st,msg);setDock(row());return}
    const sol=s.sol?`<br>${s.sol}`:'';
    finishQ(s,st,false,'',A==null?`Spokojnie, nic się nie stało! ${s.sol||''}`:`Spokojnie, nic się nie stało – błędy uczą! 💙<br>Poprawny wynik: <b>${answerText(s,A)}</b>.${sol}<br>Zobacz jeszcze raz, jak to wychodzi, i jedziemy dalej.`);
  };
  const row=()=>{
    inp.value='';
    const w=el('div','grid');
    w.append(inp);if(s.unit)w.append(el('span','',s.unit));
    w.append(btn('Sprawdź ✓','primary',go),hintBtn(s,st),btn('Nie wiem 🤷','ghost',()=>{me('Nie wiem');st.tries=2;const A=typeof s.a==='function'?s.a(cur.S):s.a;finishQ(s,st,false,'',`Nic nie szkodzi! Pokażę Ci, jak to zrobić. 💙<br>${A==null?'':`Poprawny wynik: <b>${answerText(s,A)}</b>.<br>`}${s.sol||s.hint||''}`)}));
    return w;
  };
  inp.onkeydown=e=>{if(e.key==='Enter')go()};
  setDock(row());
};

STEP.multi=s=>{
  say(s.q);
  const st={tries:0,hinted:false};
  const grid=el('div','grid');
  const ins=s.fields.map(f=>{
    const w=el('label','fld');w.innerHTML=`<span>${f.l}</span>`;
    const i=el('input');i.type='text';i.inputMode='decimal';i.autocomplete='off';
    w.appendChild(i);if(f.u)w.appendChild(el('em','',f.u));grid.appendChild(w);return i;
  });
  const go=()=>{
    const vals=ins.map(i=>parse(i.value));
    const empty=vals.findIndex(v=>isNaN(v));
    if(empty>=0){flash(ins[empty]);ins[empty].focus();return}
    me(s.fields.map((f,k)=>`${f.l}: <b>${fmt(vals[k])}</b>`).join('<br>'));
    const oks=vals.map((v,k)=>close(v,s.fields[k].a));
    ins.forEach((i,k)=>{i.classList.toggle('good',oks[k]);i.classList.toggle('bad',!oks[k])});
    if(oks.every(Boolean))return finishQ(s,st,true);
    st.tries++;
    if(st.tries<2){wrongMsg(s,st,'Czerwone pola są do poprawki, zielone są dobre.');ins.find((_,k)=>!oks[k]).focus();return}
    finishQ(s,st,false,'',`Nic nie szkodzi! 💙 Poprawne odpowiedzi:<br>${s.fields.map(f=>`${f.l}: <b>${fmt(f.a)}</b>${f.u?' '+f.u:''}`).join('<br>')}${s.sol?'<br>'+s.sol:''}`);
  };
  ins.forEach((i,k)=>{i.onkeydown=e=>{if(e.key==='Enter'){if(k<ins.length-1)ins[k+1].focus();else go()}}});
  setDock(grid,btn('Sprawdź ✓','primary',go),hintBtn(s,st));
  ins[0].focus();
};

STEP.choice=s=>{
  say(s.q);
  const st={tries:0,hinted:false};
  const multi=Array.isArray(s.a),A=multi?s.a:[s.a];
  const order=s.fixed?s.opts.map((_,i)=>i):shuffle(s.opts.map((_,i)=>i));
  const box=el('div','opts');const sel=new Set();const bt={};
  const submit=S=>{
    const ok=S.size===A.length&&A.every(i=>S.has(i));
    me([...S].map(i=>s.opts[i]).join('<br>'));
    if(ok){order.forEach(i=>{bt[i].disabled=true;if(A.includes(i))bt[i].classList.add('good')});return finishQ(s,st,true)}
    st.tries++;
    if(st.tries<2){
      wrongMsg(s,st,multi?'Któraś z zaznaczonych odpowiedzi jest zła albo brakuje którejś dobrej.':'');
      if(multi){sel.clear();order.forEach(i=>bt[i].classList.remove('sel'))}
      else S.forEach(i=>{bt[i].classList.add('bad');bt[i].disabled=true});
      return;
    }
    order.forEach(i=>{bt[i].disabled=true;if(A.includes(i))bt[i].classList.add('good')});
    finishQ(s,st,false,'',`Nic nie szkodzi! 💙 Poprawna odpowiedź:<br><b>${A.map(i=>s.opts[i]).join('<br>')}</b>${s.hint?'<br>'+s.hint:''}`);
  };
  order.forEach(i=>{
    const b=el('button','opt',s.opts[i]);b.type='button';bt[i]=b;
    b.onclick=()=>{if(multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else submit(new Set([i]))};
    box.appendChild(b);
  });
  const bar=[];
  if(multi){bar.push(el('div','','Zaznacz <b>wszystkie</b> poprawne odpowiedzi, potem kliknij „Sprawdź”.'));bar.push(btn('Sprawdź ✓','primary',()=>{if(!sel.size){flash(box);return}submit(new Set(sel))}))}
  bar.push(hintBtn(s,st));
  setDock(box,...bar);
};

STEP.text=s=>{
  say(s.q);
  const st={tries:0,hinted:false};
  const inp=el('input','inp');inp.type='text';inp.placeholder='Wpisz odpowiedź…';inp.autocomplete='off';inp.autocapitalize='none';
  const go=()=>{
    const v=inp.value.trim();if(!v){flash(inp);return}
    me(v);
    if(s.acc.some(a=>norm(a)===norm(v)))return finishQ(s,st,true);
    st.tries++;
    if(st.tries<2){wrongMsg(s,st);inp.value='';inp.focus();return}
    finishQ(s,st,false,'',`Nic nie szkodzi! 💙 ${s.sol||'Poprawna odpowiedź: <b>'+s.acc[0]+'</b>'}`);
  };
  inp.onkeydown=e=>{if(e.key==='Enter')go()};
  setDock(inp,btn('Sprawdź ✓','primary',go),hintBtn(s,st));
};

STEP.note=s=>{
  say(s.q);
  setDock(btn('Zrobione ✅','primary',()=>{me('Zrobione ✅');say(pick(['Super, tak trzymaj! 👏','Świetna robota! 🌟','Brawo za wytrwałość! 💪']));setDock();setTimeout(next,500)}),
    s.hint?btn('🆘 Potrzebuję podpowiedzi','ghost',()=>say(`<span class="tip">💡 ${s.hint}</span>`,'warn')):null);
};

STEP.gate=s=>{
  const msg=cur.weak?`Było kilka błędów, więc radzę <b>jeszcze trochę poćwiczyć</b> – powtórzenie to najlepszy sposób! 💪`:`Idzie Ci świetnie! Zostało jeszcze <b>${s.skip}</b> przykładów do ćwiczeń. Chcesz je zrobić?`;
  say(msg+(cur.weak?`<br>Zostało ${s.skip} przykładów.`:''));
  setDock(btn('Jeszcze trochę! 💪','primary',()=>{setDock();next()}),btn('Wystarczy, idziemy dalej ▶','ghost',()=>{cur.i+=s.skip;setDock();next()}));
};

STEP.widget=s=>{if(s.name==='comma')widgetComma();setDock(btn('Dalej ▶','primary',()=>{setDock();next()}))};
function widgetComma(){
  const w=el('div','widget');
  w.innerHTML=`<div><b>🔧 Maszyna do przesuwania przecinka</b></div>
   <div class="wrow">Liczba: <input value="6,2" inputmode="decimal" aria-label="liczba"></div>
   <div class="wrow" id="ops"></div>
   <div class="wres" id="res">6,2</div>`;
  const inp=$('input',w),ops=$('#ops',w),res=$('#res',w);
  const ex=[['· 10',1],['· 100',2],['· 1000',3],[': 10',-1],[': 100',-2],[': 1000',-3]];
  ex.forEach(([t,k])=>{
    const b=btn(t,'',()=>{
      const v=inp.value.replace(',','.').trim();
      if(!/^\d+(\.\d+)?$/.test(v)){res.innerHTML='Wpisz liczbę, np. 6,2';return}
      const r=shiftComma(v,k);
      res.innerHTML=`${v.replace('.',',')} ${t} = <b>${r}</b><small>przecinek skacze o ${Math.abs(k)} ${Math.abs(k)===1?'miejsce':'miejsca'} w ${k>0?'PRAWO ➡️':'LEWO ⬅️'}</small>`;
    });
    ops.appendChild(b);
  });
  const m=el('div','msg');m.innerHTML='<div class="av"></div>';m.appendChild(w);chat.appendChild(m);scrollDown();
}

/* --- koniec zadania --- */
function finish(){
  const c=cur;
  const ratio=c.max?c.pts/c.max:1;
  const stars=ratio>=.85?3:ratio>=.6?2:1;
  const key=taskKey(c.ci,c.ti),prev=store.prog[key];
  if(!prev||stars>=prev.stars)store.prog[key]={stars,pct:Math.round(ratio*100)};
  save();buildSide();
  const msg=stars===3?'Rewelacja! Opanowane na medal. 🏅':stars===2?'Dobrze Ci poszło! Jeszcze trochę ćwiczeń i będzie perfekcyjnie. 💪':'Dobra robota, że doszło się do końca! To zadanie warto <b>powtórzyć</b> – za drugim razem pójdzie lepiej. 🌱';
  say(`<div class="big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><b>Koniec zadania: ${c.task.title}</b><br>${c.max?`Wynik: <b>${Math.round(ratio*100)}%</b>. `:''}${msg}`,'good');
  const n=nextUndone([c.ci,c.ti]);
  const bs=[];
  if(n)bs.push(btn('Następne zadanie ▶','primary',()=>startTask(n[0],n[1])));
  else say('🎉 <b>Przeszedł/przeszłaś całą książkę!</b> Naprawdę. Jestem dumna jak sowa! Możesz wracać do dowolnego zadania z listy i próbować zdobyć komplet gwiazdek.');
  if(stars<3)bs.push(btn('Powtórz to zadanie 🔁',n?'':'primary',()=>startTask(c.ci,c.ti)));
  bs.push(btn('Lista zadań ☰','ghost',()=>side.classList.add('open')));
  setDock(...bs);
}

/* --- powitanie --- */
function intro(){
  cur=null;chat.innerHTML='';buildSide();
  if(!store.name){
    say(`Cześć! 👋 Jestem <b>Sowa Liczba</b> 🦉 i będę Twoim korepetytorem z matematyki.<br>Razem przejdziemy <b>wszystkie zadania</b> z Twojej książki – krok po kroku.<br><br>Jak masz na imię?`);
    const inp=el('input','inp');inp.placeholder='Twoje imię…';inp.autocomplete='off';
    const go=()=>{const v=inp.value.trim();if(!v){flash(inp);return}store.name=v.slice(0,30);save();me(store.name);welcome()};
    inp.onkeydown=e=>{if(e.key==='Enter')go()};
    setDock(inp,btn('Zaczynamy! ▶','primary',go));
  }else welcome(true);
}
function welcome(back){
  const n=nextUndone(null);
  const done=Object.keys(store.prog).length;
  if(!back){
    say(`Miło Cię poznać, <b>{name}</b>! 😊 Oto jak to działa:
     <div class="ex">1️⃣ Tłumaczę nowe rzeczy krótko i na przykładach.<br>2️⃣ Potem <b>Ty liczysz</b> – wpisujesz odpowiedzi (przecinek lub kropka, jak wolisz).<br>3️⃣ Jeśli się pomylisz – dostaniesz podpowiedź i drugą szansę. 💡<br>4️⃣ Na koniec sprawdzam, czy <b>rozumiesz</b> – nie tylko czy wynik się zgadza.<br>5️⃣ Za każde zadanie dostajesz do 3 gwiazdek ⭐</div>
     Przygotuj <b>zeszyt i długopis</b>. Błędy to nie wstyd – to najlepszy sposób nauki. Gotowy/gotowa?`);
  }else{
    say(`Cześć z powrotem, <b>{name}</b>! 🦉 Masz już ${done} ukończonych zadań i ${totalStars()} ⭐. ${n?'Chcesz kontynuować?':'Ukończyłeś/ukończyłaś wszystko! 🎉'}`);
  }
  const bs=[];
  if(n)bs.push(btn(done?`Kontynuuj: ${CH[n[0]].tasks[n[1]].title}`:'Zaczynamy od początku ▶','primary',()=>startTask(n[0],n[1])));
  bs.push(btn('Wybiorę zadanie z listy ☰','ghost',()=>side.classList.add('open')));
  setDock(...bs);
}
window.__tutor={CH,startTask,STEP,get cur(){return cur},store};
intro();
</script>
